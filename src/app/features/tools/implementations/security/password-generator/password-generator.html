<section class="tool-page">

  <header class="tool-page__header">
    <span>SECURITY TOOL</span>

    <h1>Password Generator</h1>

    <p>
      Generate random passwords locally using
      cryptographically secure browser randomness.
    </p>
  </header>


  <section class="options-panel">

    <div class="options-panel__header">
      <h2>Password Configuration</h2>
      <p>Choose the character sets and password length.</p>
    </div>


    <div class="control">

      <label for="password-length">
        Length: {{ length }}
      </label>

      <input
        id="password-length"
        type="range"
        min="6"
        max="64"
        [(ngModel)]="length"
      />

    </div>


    <div class="checkbox-grid">

      <label class="checkbox-option">
        <input
          type="checkbox"
          [(ngModel)]="includeUppercase"
        />
        Uppercase
      </label>


      <label class="checkbox-option">
        <input
          type="checkbox"
          [(ngModel)]="includeLowercase"
        />
        Lowercase
      </label>


      <label class="checkbox-option">
        <input
          type="checkbox"
          [(ngModel)]="includeNumbers"
        />
        Numbers
      </label>


      <label class="checkbox-option">
        <input
          type="checkbox"
          [(ngModel)]="includeSymbols"
        />
        Symbols
      </label>

    </div>

  </section>


  <section class="tool-panel">

    <div class="tool-panel__header">

      <label>
        Generated Password
      </label>

      @if (password) {
        <span class="status-badge status-badge--success">
          {{ passwordStrength }}
        </span>
      }

    </div>


    <div class="result-box">
      {{ password || 'Click Generate Password...' }}
    </div>


    <div class="button-row">

      <button
        type="button"
        class="tool-action"
        [disabled]="!characterPool"
        (click)="generate()"
      >
        Generate Password
      </button>

      <button
        type="button"
        class="tool-action tool-action--secondary"
        [disabled]="!password"
        (click)="copyPassword()"
      >
        Copy Password
      </button>

    </div>

  </section>

</section>
