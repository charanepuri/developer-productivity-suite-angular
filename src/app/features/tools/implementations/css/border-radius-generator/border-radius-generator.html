<section class="css-tool">
  <header class="css-tool__header">
    <h1>Border Radius Generator</h1>
    <p>Create custom rounded corners for CSS elements.</p>
  </header>

  <div class="css-tool__workspace">
    <section class="css-tool__panel">
      <h2>Corner Controls</h2>

      <div class="css-tool__controls">

        <div class="css-tool__field">
          <label>Top Left</label>
          <div class="css-tool__range">
            <input
              type="range"
              min="0"
              max="100"
              [(ngModel)]="topLeft"
            />
            <output>{{ topLeft }}px</output>
          </div>
        </div>

        <div class="css-tool__field">
          <label>Top Right</label>
          <div class="css-tool__range">
            <input
              type="range"
              min="0"
              max="100"
              [(ngModel)]="topRight"
            />
            <output>{{ topRight }}px</output>
          </div>
        </div>

        <div class="css-tool__field">
          <label>Bottom Right</label>
          <div class="css-tool__range">
            <input
              type="range"
              min="0"
              max="100"
              [(ngModel)]="bottomRight"
            />
            <output>{{ bottomRight }}px</output>
          </div>
        </div>

        <div class="css-tool__field">
          <label>Bottom Left</label>
          <div class="css-tool__range">
            <input
              type="range"
              min="0"
              max="100"
              [(ngModel)]="bottomLeft"
            />
            <output>{{ bottomLeft }}px</output>
          </div>
        </div>

        <div class="css-tool__buttons">
          <button
            class="css-tool__button css-tool__button--primary"
            type="button"
            (click)="copy()"
          >
            Copy CSS
          </button>

          <button
            class="css-tool__button css-tool__button--secondary"
            type="button"
            (click)="reset()"
          >
            Reset
          </button>
        </div>
      </div>
    </section>

    <section class="css-tool__panel">
      <h2>Preview</h2>

      <div class="css-tool__preview">
        <div
          class="css-tool__preview-box"
          [style.border-radius]="borderRadius"
        ></div>
      </div>

      <pre class="css-tool__code">{{ cssCode }}</pre>
    </section>
  </div>
</section>
