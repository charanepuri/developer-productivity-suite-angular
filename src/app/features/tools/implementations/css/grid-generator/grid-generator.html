<section class="css-tool">
  <header class="css-tool__header">
    <h1>Grid Generator</h1>
    <p>Generate responsive CSS Grid layouts visually.</p>
  </header>

  <div class="css-tool__workspace">
    <section class="css-tool__panel">
      <h2>Grid Controls</h2>

      <div class="css-tool__controls">

        <div class="css-tool__field">
          <label>Columns</label>

          <div class="css-tool__range">
            <input
              type="range"
              min="1"
              max="6"
              [(ngModel)]="columns"
            />

            <output>{{ columns }}</output>
          </div>
        </div>

        <div class="css-tool__field">
          <label>Rows</label>

          <div class="css-tool__range">
            <input
              type="range"
              min="1"
              max="6"
              [(ngModel)]="rows"
            />

            <output>{{ rows }}</output>
          </div>
        </div>

        <div class="css-tool__field">
          <label>Gap</label>

          <div class="css-tool__range">
            <input
              type="range"
              min="0"
              max="50"
              [(ngModel)]="gap"
            />

            <output>{{ gap }}px</output>
          </div>
        </div>

        <div class="css-tool__buttons">
          <button
            class="css-tool__button css-tool__button--primary"
            type="button"
            (click)="copy()"
          >
            Copy CSS
          </button>

          <button
            class="css-tool__button css-tool__button--secondary"
            type="button"
            (click)="reset()"
          >
            Reset
          </button>
        </div>
      </div>
    </section>

    <section class="css-tool__panel">
      <h2>Preview — {{ itemCount }} Items</h2>

      <div class="css-tool__preview">
        <div class="grid-preview" [ngStyle]="gridStyle">
          @for (item of [].constructor(itemCount); track $index) {
            <div class="grid-preview__item">
              {{ $index + 1 }}
            </div>
          }
        </div>
      </div>

      <pre class="css-tool__code">{{ cssCode }}</pre>
    </section>
  </div>
</section>
